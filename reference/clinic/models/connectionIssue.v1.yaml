title: Connection Issue
type: object
description: The highest priority connection problem detected for the patient.
properties:
  cause:
    type: string
    enum:
      - error
      - disconnected
      - staleData
      - staleInvite
      - expiredInvite
    x-enum-varnames:
      - ConnectionIssueCauseError
      - ConnectionIssueCauseDisconnected
      - ConnectionIssueCauseStaleData
      - ConnectionIssueCauseStaleInvite
      - ConnectionIssueCauseExpiredInvite
  hidden:
    type: boolean
    description: Set by a clinician to hide the issue. Cleared when the connection issue source or the cause changes.
required:
  - cause
