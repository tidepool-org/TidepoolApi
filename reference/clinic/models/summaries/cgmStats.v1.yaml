type: object
title: cgmstats.v1
description: 'A summary of a users recent CGM glucose values'
properties:
  id:
    allOf:
      - $ref: '../../../summary/models/summaryId.v1.yaml'
    description: >-
      Identifier of the stored summary. Absent from a summary computed for a glycemic
      range set other than the standard one, which is never stored.
  config:
    $ref: '../../../summary/models/summaryConfig.v1.yaml'
  dates:
    $ref: '../../../summary/models/summaryDates.v1.yaml'
  periods:
    $ref: '../../../summary/models/cgm/cgmPeriods.v1.yaml'
