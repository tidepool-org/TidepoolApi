title: Linked Identity Provider
description: An external identity provider linked to a clinician account.
type: object
properties:
  alias:
    type: string
    description: The unique alias identifying the identity provider configuration.
    minLength: 1
    example: 'google-oidc'
  name:
    type: string
    description: The display name of the identity provider.
    minLength: 1
    example: 'Google'
required:
  - alias
  - name
