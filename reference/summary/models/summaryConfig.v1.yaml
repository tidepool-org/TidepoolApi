type: object
title: config.v1
x-go-type-skip-optional-pointer: true
description: >-
  Summary schema version and calculation configuration. The very low and very high
  thresholds are omitted when the glycemic range set the summary was computed with has no
  such boundary, so no reading falls outside it.
properties:
  schemaVersion:
    description: Summary schema version
    type: number
    x-go-type: int
  glycemicRangesKey:
    description: >-
      Key of the glycemic range set the summary was computed with (see
      `glycemicRanges.key` in the clinic API), e.g. `preset:adaStandard`. Absent from
      summaries stored before this field existed, which were all computed with the
      standard ranges.
    type: string
    example: preset:adaStandard
    x-go-type-skip-optional-pointer: true
  highGlucoseThreshold:
    description: Threshold used for determining if a value is high
    type: number
    x-go-type: float64
  veryHighGlucoseThreshold:
    description: Threshold used for determining if a value is very high
    type: number
    x-go-type: float64
  lowGlucoseThreshold:
    description: Threshold used for determining if a value is low
    type: number
    x-go-type: float64
  veryLowGlucoseThreshold:
    description: Threshold used for determining if a value is very low
    type: number
    x-go-type: float64

required:
  - schemaVersion
  - lowGlucoseThreshold
  - highGlucoseThreshold
