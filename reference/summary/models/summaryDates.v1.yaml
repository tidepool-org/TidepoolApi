type: object
title: dates.v1
x-go-type-skip-optional-pointer: true
description: |-
  dates tracked for summary calculation

  Summaries are no longer marked outdated: they are recalculated by upload postprocess work, so the fields
  marked deprecated are no longer set. A summary stored before the change keeps them until it is recalculated.
properties:
  lastUpdatedDate:
    description: Date of the last calculation
    type: string
    format: date-time

  lastUpdatedReason:
    description: No longer set; reported empty. Formerly the list of reasons the summary was updated for.
    deprecated: true
    type: array
    items:
      type: string

  hasFirstData:
    type: boolean
  firstData:
    description: Date of the first included value
    type: string
    format: date-time

  hasLastData:
    type: boolean
  lastData:
    description: Date of the last calculated value
    type: string
    format: date-time

  hasLastUploadDate:
    type: boolean
  lastUploadDate:
    description: Created date of the last calculated value
    type: string
    format: date-time

  hasOutdatedSince:
    description: No longer set; reported false.
    deprecated: true
    type: boolean
  outdatedSince:
    description: No longer set. Formerly the date of the first user upload after lastData, removed when calculated.
    deprecated: true
    type: string
    format: date-time

  outdatedSinceLimit:
    description: No longer set. Formerly the upper limit of the OutdatedSince value to prevent infinite queue duration.
    deprecated: true
    type: string
    format: date-time

  outdatedReason:
    description: No longer set; reported empty. Formerly the list of reasons the summary was marked outdated for.
    deprecated: true
    type: array
    items:
      type: string

required:
  - hasFirstData
  - hasLastData
  - hasLastUploadDate
  - hasOutdatedSince
